version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: xdynamic-api:latest
    container_name: xdynamic-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env.production
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - xdynamic-network

networks:
  xdynamic-network:
    driver: bridge
